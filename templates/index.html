<!DOCTYPE html>
<html lang="en">

<head>
    <title>KLYRO // SYSTEM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=VT323&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --clr-bg: #050a05;
            --clr-bg2: #0a100a;
            --clr-panel: #080e08;
            --clr-border: #1a3a1a;
            --clr-accent: #00ff41;
            --clr-accent2: #00cc33;
            --clr-accent-dim: rgba(0, 255, 65, 0.15);
            --clr-accent-glow: rgba(0, 255, 65, 0.4);
            --clr-text: #b8ffb8;
            --clr-text-dim: #4a7a4a;
            --clr-text-bright: #00ff41;
            --clr-inactive: #1a3a1a;
            --clr-player-bg: #06080d;
            --font-mono: 'Share Tech Mono', monospace;
            --font-display: 'Orbitron', monospace;
            --font-crt: 'VT323', monospace;
            --scanline-opacity: 0.04;
        }

        [data-theme="blue"] {
            --clr-bg: #020510;
            --clr-bg2: #050a18;
            --clr-panel: #030710;
            --clr-border: #0a1f4a;
            --clr-accent: #00b4ff;
            --clr-accent2: #0080cc;
            --clr-accent-dim: rgba(0, 180, 255, 0.12);
            --clr-accent-glow: rgba(0, 180, 255, 0.4);
            --clr-text: #b8d8ff;
            --clr-text-dim: #2a4a6a;
            --clr-text-bright: #00b4ff;
            --clr-inactive: #0a1f4a;
            --clr-player-bg: #020510;
        }

        [data-theme="amber"] {
            --clr-bg: #0a0700;
            --clr-bg2: #120e00;
            --clr-panel: #0d0900;
            --clr-border: #3a2500;
            --clr-accent: #ffb300;
            --clr-accent2: #cc8800;
            --clr-accent-dim: rgba(255, 179, 0, 0.12);
            --clr-accent-glow: rgba(255, 179, 0, 0.4);
            --clr-text: #fff0b8;
            --clr-text-dim: #5a4010;
            --clr-text-bright: #ffb300;
            --clr-inactive: #2a1a00;
            --clr-player-bg: #080500;
        }

        [data-theme="red"] {
            --clr-bg: #0a0202;
            --clr-bg2: #120404;
            --clr-panel: #0d0303;
            --clr-border: #3a0a0a;
            --clr-accent: #ff2244;
            --clr-accent2: #cc1133;
            --clr-accent-dim: rgba(255, 34, 68, 0.12);
            --clr-accent-glow: rgba(255, 34, 68, 0.4);
            --clr-text: #ffb8c0;
            --clr-text-dim: #5a1a20;
            --clr-text-bright: #ff2244;
            --clr-inactive: #2a0808;
            --clr-player-bg: #080202;
        }

        [data-theme="white"] {
            --clr-bg: #080808;
            --clr-bg2: #101010;
            --clr-panel: #0c0c0c;
            --clr-border: #303030;
            --clr-accent: #e8e8e8;
            --clr-accent2: #b0b0b0;
            --clr-accent-dim: rgba(232, 232, 232, 0.1);
            --clr-accent-glow: rgba(232, 232, 232, 0.3);
            --clr-text: #d0d0d0;
            --clr-text-dim: #404040;
            --clr-text-bright: #ffffff;
            --clr-inactive: #1a1a1a;
            --clr-player-bg: #060606;
        }

        [data-theme="cyan"] {
            --clr-bg: #020a0a;
            --clr-bg2: #041212;
            --clr-panel: #030d0d;
            --clr-border: #0a3030;
            --clr-accent: #00e5cc;
            --clr-accent2: #00b0a0;
            --clr-accent-dim: rgba(0, 229, 204, 0.12);
            --clr-accent-glow: rgba(0, 229, 204, 0.4);
            --clr-text: #b8fff8;
            --clr-text-dim: #1a5050;
            --clr-text-bright: #00e5cc;
            --clr-inactive: #081e1e;
            --clr-player-bg: #020808;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-mono);
            background: var(--clr-bg);
            color: var(--clr-text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            cursor: crosshair;
        }

        /* CRT scanlines overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.15) 2px,
                    rgba(0, 0, 0, 0.15) 4px);
            pointer-events: none;
            z-index: 9998;
        }

        /* CRT vignette */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.7) 100%);
            pointer-events: none;
            z-index: 9997;
        }

        /* Particle canvas */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        .app-wrapper {
            position: relative;
            z-index: 1;
            max-width: 860px;
            margin: 0 auto;
            padding: 0 0 220px 0;
        }

        /* HEADER */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px 14px;
            border-bottom: 1px solid var(--clr-border);
            background: var(--clr-panel);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 6px;
            color: var(--clr-accent);
            text-shadow: 0 0 20px var(--clr-accent-glow), 0 0 40px var(--clr-accent-glow);
            animation: logoPulse 4s ease-in-out infinite;
        }

        @keyframes logoPulse {

            0%,
            100% {
                text-shadow: 0 0 10px var(--clr-accent-glow), 0 0 30px var(--clr-accent-glow);
            }

            50% {
                text-shadow: 0 0 20px var(--clr-accent-glow), 0 0 60px var(--clr-accent-glow), 0 0 80px var(--clr-accent-dim);
            }
        }

        .logo-sub {
            font-family: var(--font-crt);
            font-size: 15px;
            color: var(--clr-text-dim);
            letter-spacing: 3px;
            line-height: 1;
        }

        .sys-status {
            font-family: var(--font-crt);
            font-size: 14px;
            color: var(--clr-text-dim);
            letter-spacing: 2px;
        }

        .sys-status span {
            color: var(--clr-accent);
            animation: blink 1.2s step-end infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* THEME SWITCHER */
        .theme-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-bottom: 1px solid var(--clr-border);
            background: var(--clr-bg2);
        }

        .theme-label {
            font-family: var(--font-crt);
            font-size: 13px;
            color: var(--clr-text-dim);
            letter-spacing: 2px;
            margin-right: 6px;
            flex-shrink: 0;
        }

        .theme-btn {
            width: 26px;
            height: 26px;
            border: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-btn::after {
            content: '';
            width: 12px;
            height: 12px;
            display: block;
            border: 1px solid currentColor;
        }

        .theme-btn:hover {
            transform: scale(1.2);
        }

        .theme-btn.active {
            border-color: var(--clr-accent);
        }

        .theme-btn.active::after {
            box-shadow: 0 0 6px currentColor;
        }

        .theme-btn[data-t="green"] {
            color: #00ff41;
        }

        .theme-btn[data-t="blue"] {
            color: #00b4ff;
        }

        .theme-btn[data-t="amber"] {
            color: #ffb300;
        }

        .theme-btn[data-t="red"] {
            color: #ff2244;
        }

        .theme-btn[data-t="white"] {
            color: #e0e0e0;
        }

        .theme-btn[data-t="cyan"] {
            color: #00e5cc;
        }

        /* INPUT SECTION */
        .input-section {
            padding: 16px 24px;
            background: var(--clr-panel);
            border-bottom: 1px solid var(--clr-border);
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-row:last-child {
            margin-bottom: 0;
        }

        .input-label {
            font-family: var(--font-crt);
            font-size: 13px;
            color: var(--clr-text-dim);
            letter-spacing: 2px;
            white-space: nowrap;
            flex-shrink: 0;
            width: 80px;
        }

        input[type="text"] {
            flex: 1;
            background: var(--clr-bg);
            border: 1px solid var(--clr-border);
            color: var(--clr-text);
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 8px 12px;
            letter-spacing: 1px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]::placeholder {
            color: var(--clr-text-dim);
            font-family: var(--font-crt);
            letter-spacing: 1px;
        }

        input[type="text"]:focus {
            border-color: var(--clr-accent);
            box-shadow: 0 0 0 1px var(--clr-accent), inset 0 0 12px var(--clr-accent-dim);
            color: var(--clr-text-bright);
        }

        .btn {
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 9px 16px;
            border: 1px solid var(--clr-accent);
            background: transparent;
            color: var(--clr-accent);
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s, color 0.15s;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .btn:hover {
            background: var(--clr-accent-dim);
            box-shadow: 0 0 12px var(--clr-accent-glow), inset 0 0 8px var(--clr-accent-dim);
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* SONG LIST */
        .list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px 8px;
            border-bottom: 1px solid var(--clr-border);
        }

        .list-header-label {
            font-family: var(--font-crt);
            font-size: 13px;
            color: var(--clr-text-dim);
            letter-spacing: 3px;
        }

        .track-count {
            font-family: var(--font-crt);
            font-size: 13px;
            color: var(--clr-accent);
            letter-spacing: 2px;
        }

        ul#list {
            list-style: none;
            padding: 0;
            margin: 0 0 0 0;
        }

        ul#list li {
            display: flex;
            align-items: center;
            padding: 0 24px;
            height: 46px;
            border-bottom: 1px solid var(--clr-border);
            cursor: pointer;
            transition: background 0.1s;
            position: relative;
            overflow: hidden;
        }

        ul#list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--clr-accent);
            transform: scaleY(0);
            transition: transform 0.15s;
        }

        ul#list li:hover {
            background: var(--clr-accent-dim);
        }

        ul#list li:hover::before {
            transform: scaleY(1);
        }

        ul#list li.active {
            background: var(--clr-accent-dim);
            color: var(--clr-accent);
        }

        ul#list li.active::before {
            transform: scaleY(1);
        }

        .track-num {
            font-family: var(--font-crt);
            font-size: 13px;
            color: var(--clr-text-dim);
            width: 36px;
            flex-shrink: 0;
            letter-spacing: 1px;
        }

        li.active .track-num {
            color: var(--clr-accent);
        }

        .track-name {
            font-family: var(--font-mono);
            font-size: 13px;
            letter-spacing: 1px;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playing-indicator {
            display: none;
            align-items: center;
            gap: 2px;
            margin-left: 12px;
        }

        li.active .playing-indicator {
            display: flex;
        }

        .playing-indicator span {
            display: block;
            width: 2px;
            background: var(--clr-accent);
            animation: equalize 0.8s ease-in-out infinite alternate;
        }

        .playing-indicator span:nth-child(1) {
            height: 8px;
            animation-delay: 0s;
        }

        .playing-indicator span:nth-child(2) {
            height: 14px;
            animation-delay: 0.15s;
        }

        .playing-indicator span:nth-child(3) {
            height: 10px;
            animation-delay: 0.3s;
        }

        .playing-indicator span:nth-child(4) {
            height: 6px;
            animation-delay: 0.45s;
        }

        @keyframes equalize {
            from {
                transform: scaleY(0.3);
            }

            to {
                transform: scaleY(1);
            }
        }

        /* PLAYER */
        #player-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--clr-player-bg);
            border-top: 1px solid var(--clr-accent);
            box-shadow: 0 -4px 40px var(--clr-accent-glow), 0 -1px 0 var(--clr-accent);
            z-index: 200;
            padding: 12px 24px 14px;
        }

        .player-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        #now-playing {
            font-family: var(--font-crt);
            font-size: 18px;
            color: var(--clr-accent);
            letter-spacing: 2px;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 10px var(--clr-accent-glow);
        }

        .player-meta {
            font-family: var(--font-crt);
            font-size: 13px;
            color: var(--clr-text-dim);
            letter-spacing: 2px;
            flex-shrink: 0;
            margin-left: 20px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .ctrl-btn {
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 7px 14px;
            border: 1px solid var(--clr-border);
            background: transparent;
            color: var(--clr-text-dim);
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
        }

        .ctrl-btn:hover {
            border-color: var(--clr-accent);
            color: var(--clr-accent);
            box-shadow: 0 0 8px var(--clr-accent-glow);
        }

        .ctrl-btn.active-mode {
            background: var(--clr-accent-dim);
            border-color: var(--clr-accent);
            color: var(--clr-accent);
            box-shadow: 0 0 10px var(--clr-accent-glow);
        }

        audio {
            width: 100%;
            height: 32px;
            accent-color: var(--clr-accent);
            color-scheme: dark;
        }

        audio::-webkit-media-controls-panel {
            background: var(--clr-bg2);
        }

        audio::-webkit-media-controls-timeline {
            accent-color: var(--clr-accent);
        }

        /* Flicker animation on load */
        @keyframes flicker {
            0% {
                opacity: 0.8;
            }

            2% {
                opacity: 0.5;
            }

            4% {
                opacity: 0.9;
            }

            8% {
                opacity: 0.7;
            }

            10% {
                opacity: 1;
            }

            100% {
                opacity: 1;
            }
        }

        .app-wrapper {
            animation: flicker 1.5s ease-out forwards;
        }

        /* Corner decorations */
        .corner-deco {
            position: fixed;
            width: 30px;
            height: 30px;
            z-index: 9996;
            pointer-events: none;
        }

        .corner-deco.tl {
            top: 6px;
            left: 6px;
            border-top: 1px solid var(--clr-accent);
            border-left: 1px solid var(--clr-accent);
        }

        .corner-deco.tr {
            top: 6px;
            right: 6px;
            border-top: 1px solid var(--clr-accent);
            border-right: 1px solid var(--clr-accent);
        }

        .corner-deco.bl {
            bottom: 6px;
            left: 6px;
            border-bottom: 1px solid var(--clr-accent);
            border-left: 1px solid var(--clr-accent);
        }

        .corner-deco.br {
            bottom: 6px;
            right: 6px;
            border-bottom: 1px solid var(--clr-accent);
            border-right: 1px solid var(--clr-accent);
        }

        .empty-state {
            padding: 40px 24px;
            text-align: center;
            font-family: var(--font-crt);
            font-size: 18px;
            color: var(--clr-text-dim);
            letter-spacing: 3px;
        }
    </style>
</head>

<body>

    <!-- Corner decorations -->
    <div class="corner-deco tl"></div>
    <div class="corner-deco tr"></div>
    <div class="corner-deco bl"></div>
    <div class="corner-deco br"></div>

    <!-- Particle canvas -->
    <canvas id="particle-canvas"></canvas>

    <div class="app-wrapper">

        <!-- HEADER -->
        <header>
            <div class="header-left">
                <div>
                    <div class="logo">KLYRO</div>
                    <div class="logo-sub">// AUDIO SYSTEM</div>
                </div>
            </div>
            <div class="sys-status">SYS_ONLINE <span>█</span></div>
        </header>

        <!-- THEME BAR -->
        <div class="theme-bar">
            <span class="theme-label">THEME://</span>
            <button class="theme-btn active" data-t="green" title="Green" onclick="setTheme('green', this)"></button>
            <button class="theme-btn" data-t="blue" title="Blue" onclick="setTheme('blue', this)"></button>
            <button class="theme-btn" data-t="cyan" title="Cyan" onclick="setTheme('cyan', this)"></button>
            <button class="theme-btn" data-t="amber" title="Amber" onclick="setTheme('amber', this)"></button>
            <button class="theme-btn" data-t="red" title="Red" onclick="setTheme('red', this)"></button>
            <button class="theme-btn" data-t="white" title="White" onclick="setTheme('white', this)"></button>
        </div>

        <!-- INPUT: ADD SONG -->
        <div class="input-section">
            <div class="input-row">
                <span class="input-label">YT_URL://</span>
                <input type="text" id="yt-url" placeholder="paste youtube link to add track to database...">
                <button class="btn" onclick="downloadSong()">ADD</button>
            </div>
            <div class="input-row">
                <span class="input-label">SEARCH://</span>
                <input type="text" id="search" placeholder="filter tracks...">
            </div>
        </div>

        <!-- SONG LIST -->
        <div class="list-header">
            <span class="list-header-label">// TRACK_INDEX</span>
            <span class="track-count" id="track-count">-- TRACKS</span>
        </div>

        <ul id="list"></ul>

    </div><!-- end app-wrapper -->

    <!-- PLAYER -->
    <div id="player-container">
        <div class="player-top">
            <div id="now-playing">// STANDBY — NO TRACK LOADED</div>
            <div class="player-meta" id="player-meta">&nbsp;</div>
        </div>
        <div class="controls">
            <button class="ctrl-btn" onclick="prevSong()">◄◄ PREV</button>
            <button class="ctrl-btn" onclick="nextSong()">NEXT ►►</button>
            <button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()">⇄ SHUFFLE</button>
            <button class="ctrl-btn" id="repeatBtn" onclick="toggleRepeat()">↺ REPEAT</button>
        </div>
        <audio id="player" controls></audio>
    </div>

    <script>
        /* ── PARTICLE SYSTEM ── */
        (function () {
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            function getAccentColor() {
                return getComputedStyle(document.documentElement).getPropertyValue('--clr-accent').trim() || '#00ff41';
            }

            function mkParticle() {
                return {
                    x: Math.random() * W,
                    y: Math.random() * H,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    size: Math.random() * 1.5 + 0.3,
                    alpha: Math.random() * 0.4 + 0.05,
                    blink: Math.random() * Math.PI * 2
                };
            }

            function init() {
                particles = [];
                const count = Math.floor((W * H) / 18000);
                for (let i = 0; i < count; i++) particles.push(mkParticle());
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                const accent = getAccentColor();
                const now = Date.now() / 1000;

                particles.forEach(p => {
                    p.blink += 0.01;
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0) p.x = W;
                    if (p.x > W) p.x = 0;
                    if (p.y < 0) p.y = H;
                    if (p.y > H) p.y = 0;
                    const a = p.alpha * (0.5 + 0.5 * Math.sin(p.blink));
                    ctx.globalAlpha = a;
                    ctx.fillStyle = accent;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });

                ctx.globalAlpha = 1;
                requestAnimationFrame(draw);
            }

            window.addEventListener('resize', () => { resize(); init(); });
            resize();
            init();
            draw();
        })();

        /* ── THEME SWITCHER ── */
        function setTheme(t, btn) {
            document.body.dataset.theme = t === 'green' ? '' : t;
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        /* ── ORIGINAL APP LOGIC (unchanged) ── */
        let allSongs = [];
        let currentIndex = -1;
        let isShuffle = false;
        let isRepeat = false;

        async function loadSongs() {
            const res = await fetch("/api/songs");
            allSongs = await res.json();
            renderSongs(allSongs);
        }

        function renderSongs(songs) {
            const list = document.getElementById("list");
            const tc = document.getElementById("track-count");
            list.innerHTML = "";

            if (tc) tc.textContent = songs.length + (songs.length === 1 ? ' TRACK' : ' TRACKS');

            if (songs.length === 0) {
                list.innerHTML = '<div class="empty-state">// NO TRACKS FOUND</div>';
                return;
            }

            songs.forEach((song, index) => {
                const li = document.createElement("li");

                const numSpan = document.createElement('span');
                numSpan.className = 'track-num';
                numSpan.textContent = String(index + 1).padStart(2, '0');

                const nameSpan = document.createElement('span');
                nameSpan.className = 'track-name';
                nameSpan.textContent = song.name;

                const indicator = document.createElement('div');
                indicator.className = 'playing-indicator';
                indicator.innerHTML = '<span></span><span></span><span></span><span></span>';

                li.appendChild(numSpan);
                li.appendChild(nameSpan);
                li.appendChild(indicator);

                const globalIdx = allSongs.indexOf(song);
                if (globalIdx === currentIndex) {
                    li.classList.add("active");
                }

                li.onclick = () => {
                    const realIdx = allSongs.indexOf(song);
                    playSong(realIdx);
                };

                list.appendChild(li);
            });
        }

        function playSong(index) {
            currentIndex = index;
            const song = allSongs[index];

            const player = document.getElementById("player");
            player.src = "/stream/" + encodeURIComponent(song.name);
            player.play();

            document.getElementById("now-playing").textContent = "▶ " + song.name;

            const filtered = getFilteredSongs();
            renderSongs(filtered);
        }

        function getFilteredSongs() {
            const query = document.getElementById("search").value.toLowerCase();
            return query ? allSongs.filter(s => s.name.toLowerCase().includes(query)) : allSongs;
        }

        function nextSong() {
            if (isShuffle) {
                currentIndex = Math.floor(Math.random() * allSongs.length);
            } else {
                currentIndex = (currentIndex + 1) % allSongs.length;
            }
            playSong(currentIndex);
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + allSongs.length) % allSongs.length;
            playSong(currentIndex);
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById("shuffleBtn").classList.toggle("active-mode");
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById("repeatBtn").classList.toggle("active-mode");
        }

        document.getElementById("player").addEventListener("ended", () => {
            if (isRepeat) {
                playSong(currentIndex);
            } else {
                nextSong();
            }
        });

        document.getElementById("search").addEventListener("input", (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allSongs.filter(s =>
                s.name.toLowerCase().includes(query)
            );
            renderSongs(filtered);
        });

        async function downloadSong() {
            const url = document.getElementById("yt-url").value;

            if (!url) {
                alert("Enter a YouTube URL");
                return;
            }

            const res = await fetch("/api/download", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ url })
            });

            const data = await res.json();

            if (data.error) {
                alert("Error: " + data.error);
            } else {
                alert("Downloaded!");
                document.getElementById("yt-url").value = "";
                loadSongs();
            }
        }

        loadSongs();
    </script>

</body>

</html>
